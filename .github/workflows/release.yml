name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release with minified library
        run: gh release create "$GITHUB_REF_NAME" dist/physicsplain.min.js --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
